name: SNS自動投稿

on:
  schedule:
    # 時刻は UTC（日本時間 −9時間）。GitHub の混雑で10〜20分ほど遅れることがあります
    - cron: "30 22 * * *"   # 7:30  ニュース
    - cron: "0 3 * * *"     # 12:00 面白ネタ
    - cron: "30 6 * * 1-5"  # 15:30 株（平日のみ）
    - cron: "0 9 * * *"     # 18:00 ニュース
    - cron: "0 11 * * *"    # 20:00 楽天ROOM
    - cron: "30 12 * * *"   # 21:30 面白ネタ
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿の種類"
        type: choice
        options: [funny, news, stock, room, check]
        default: funny
      dry_run:
        description: "テストモード（投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sns-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 投稿の種類を決める
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "30 22 * * *"|"0 9 * * *") echo "slot=news" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * *"|"30 12 * * *") echo "slot=funny" >> "$GITHUB_OUTPUT" ;;
            "30 6 * * 1-5")            echo "slot=stock" >> "$GITHUB_OUTPUT" ;;
            "0 11 * * *")              echo "slot=room" >> "$GITHUB_OUTPUT" ;;
            *)                         echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 投稿する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python main.py ${{ steps.slot.outputs.slot }}
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: テスト用の写真を保存
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: images/
          if-no-files-found: ignore
